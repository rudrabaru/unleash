name: CI

on:
  push:
    branches: [feature/audio-pipeline, integration, main]
  pull_request:
    branches: [integration, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          if grep -qE '^[A-Za-z]' backend/requirements-audio.txt; then
            pip install -r backend/requirements-audio.txt --extra-index-url https://download.pytorch.org/whl/cpu
          fi

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run pytest
        working-directory: backend
        run: python -m pytest tests -v

  audio-deps-smoke:
    name: Audio dependency install/import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Check ffmpeg binary
        run: ffmpeg -version

      - name: Check whether audio dependencies are declared yet
        id: check-deps
        run: |
          if grep -qE '^[A-Za-z]' backend/requirements-audio.txt; then
            echo "has_deps=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_deps=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install audio dependencies (CPU-only torch)
        if: steps.check-deps.outputs.has_deps == 'true'
        run: |
          pip install -r backend/requirements-audio.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Import smoke test
        if: steps.check-deps.outputs.has_deps == 'true'
        run: |
          python - <<'EOF'
          import importlib, re, sys

          # Derive importable module names from requirements-audio.txt.
          # Rules:
          #   - Strip version specifiers and comments.
          #   - Convert hyphens to underscores (install name vs import name).
          #   - Skip torch/torchaudio — tested separately below.
          #   - silero-vad is tested with a webrtcvad fallback.
          SKIP = {"torch", "torchaudio", "silero_vad", "silero-vad"}

          with open("backend/requirements-audio.txt") as f:
              raw = [l.strip() for l in f if l.strip() and not l.startswith("#")]

          mods = []
          for line in raw:
              name = re.split(r"[=<>!;]", line)[0].strip().replace("-", "_").lower()
              if name not in SKIP:
                  mods.append(name)

          # Test generic modules
          for m in mods:
              importlib.import_module(m)
              print(f"OK: {m}")

          # Test torch (always required)
          importlib.import_module("torch")
          print("OK: torch")

          # Test silero_vad with webrtcvad fallback (pre-approved substitution)
          try:
              importlib.import_module("silero_vad")
              print("OK: silero_vad")
          except ImportError:
              importlib.import_module("webrtcvad")
              print("OK: webrtcvad (fallback — silero_vad unavailable on this platform)")
          EOF

      - name: No audio dependencies declared
        if: steps.check-deps.outputs.has_deps == 'false'
        run: echo "backend/requirements-audio.txt has no active requirements — skipping the install/import smoke check. Not a failure. (As of Phase 2 this file is populated; this branch is a safety net only.)"
