name: CI

on:
  push:
    branches: [integration, main]
  pull_request:
    branches: [integration, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)'; then
            echo "Merge-conflict markers found"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1

      - name: Install Python dependencies
        run: pip install -r backend/requirements-dev.txt

      # faster-whisper downloads its model on first use; cache it between runs.
      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en-v1

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests -rs
